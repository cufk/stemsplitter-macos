[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dev-agent-worker"
version = "0.1.0"
description = "Mistral Workflow agent that watches CI for cufk/stemsplitter-macos and fixes failures until green"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "mistralai>=3.0",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
