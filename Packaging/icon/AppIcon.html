<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body><svg id="s" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"></svg>
<script>
const NS='http://www.w3.org/2000/svg', svg=document.getElementById('s');
// ?small=1: förenklad variant för 16–32 px (färre, tjockare staplar, kraftigare spelhuvud)
const small=new URLSearchParams(location.search).has('small');
function el(n,a,p=svg){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;}
const defs=el('defs',{});
const g=el('linearGradient',{id:'bg',x1:0,y1:0,x2:0,y2:1},defs);
el('stop',{offset:'0',  'stop-color':'#FFFFFF'},g); el('stop',{offset:'1','stop-color':'#E9E9EC'},g);
const f=el('filter',{id:'sh',x:'-20%',y:'-20%',width:'140%',height:'140%'},defs);
el('feDropShadow',{dx:0,dy:12,stdDeviation:14,'flood-color':'#000','flood-opacity':0.22},f);
const clip=el('clipPath',{id:'body'},defs); el('rect',{x:100,y:100,width:824,height:824,rx:185},clip);
// Kropp (macOS-rutnät: 824 px i 1024 px-ruta)
el('rect',{x:100,y:100,width:824,height:824,rx:185,fill:'url(#bg)',filter:'url(#sh)'});
el('rect',{x:100.5,y:100.5,width:823,height:823,rx:185,fill:'none',stroke:'#000','stroke-opacity':0.06,'stroke-width':1});
const colors=['#ED5429','#F5A623','#8C6BF2','#29AD9E'];
const x0=196,x1=828,laneH=112,gap=24,laneTop=512-(4*laneH+3*gap)/2, play=x0+(x1-x0)*0.6;
// enkel deterministisk slump
let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const shapes=[
 i=>{const p=(i%9)/9;return (i%9<6)?0.35+0.6*Math.sin(p*Math.PI)*(0.6+0.4*rnd()):0.12;}, // sång: fraser
 i=>(i%4===0?0.95:(i%2===0?0.55:0.3))*(0.85+0.15*rnd()),                             // trummor: slag
 i=>0.42+0.12*Math.sin(i*0.7)+0.06*rnd(),                                               // bas: jämn
 i=>0.25+0.55*(0.5+0.5*Math.sin(i*0.22-1.2))*(0.8+0.2*rnd())                           // övrigt: svällande
];
const bars=small?9:24, step=(x1-x0)/bars, bw=step*(small?0.62:0.56);
colors.forEach((c,li)=>{
  const y=laneTop+li*(laneH+gap), mid=y+laneH/2;
  el('rect',{x:x0-22,y,width:(x1-x0)+44,height:laneH,rx:26,fill:c,'fill-opacity':small?0.16:0.11});
  for(let i=0;i<bars;i++){
    const shape=shapes[li](i), h=Math.max(10,(small?0.55+0.45*shape:shape)*(laneH-(small?20:26))), x=x0+i*step+(step-bw)/2;
    el('rect',{x,y:mid-h/2,width:bw,height:h,rx:bw/2,fill:c,'fill-opacity':(x+bw/2<play)?1:0.38});
  }
});
// Spelhuvud
const yTop=laneTop-34, yBot=laneTop+4*laneH+3*gap+18;
el('line',{x1:play,y1:yTop,x2:play,y2:yBot,stroke:'#141414','stroke-width':small?26:11,'stroke-linecap':'round'});
el('circle',{cx:play,cy:yTop,r:small?40:24,fill:'#141414'});
</script></body></html>
